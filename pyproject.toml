[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arora-data"
version = "0.1.0"
description = "Strict read-only access layer over the AroraFund database"
requires-python = ">=3.11"
# asyncpg and pydantic match the main repo's backend/requirements.txt; numpy fits treasury_curve's nss curves.
dependencies = [
    "asyncpg==0.29.0",
    "numpy>=2,<3",
    "pydantic==2.9.2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "polars>=1,<2"]
dataframe = ["polars>=1,<2"]
notebook = ["ipykernel>=6,<7", "nbconvert>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
